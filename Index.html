<!-- This tells the browser this is an HTML5 page -->
<!DOCTYPE html>
<!-- The HTML tag goes next -->
<html>
  <!-- The head section has info for the browser and search engine -->
  <head>
    <!-- This is the page title -->
    <title>Brody's CSC 102 Homepage</title>
    <!-- Link to the css file -->
    <link rel="stylesheet" href="Main.css">
  </head>

  <!-- The body section holds what the user sees -->
  <body>
    <!-- This section has the page title and menu -->
    <header>
      <!-- Main heading -->
      <h1>You've found my CSC 102 Homepage, Welcome!</h1>
      <!-- Navigation links -->
      <nav>
        <a href="Index.html">Home</a>
        <br>
        <a href="Boards.html">Boards</a>
      </nav>
    </header>

    <!-- p is a paragraph block with spacing -->
    <p>
      <!-- Meme image that will move across the screen -->
      <img id="memeImage" src="memeImage.webp" alt="Meme image">

      <!-- line breaks to add space -->
      <br><br>

      <!-- Start button calls the startMeme function -->
      <button id="startButton" onclick="startMeme();">Start</button>
      <!-- Stop button calls the stopMeme function -->
      <button id="stopButton" onclick="stopMeme();" disabled>Stop</button>

      <!-- Sound buttons -->
      <!-- Play button calls playSound -->
      <button id="playSoundButton" onclick="playSound();">Play Sound</button>
      <!-- Pause button calls pauseSound -->
      <button id="pauseSoundButton" onclick="pauseSound();">Pause Sound</button>
      
    </p>

    <!-- Footer with name and school info -->
    <footer>
      Brody Wittenburg
      <br>
      University of Advancing Technology
      <br>
      2625 West Baseline Road
      <br>
      Tempe, Arizona 85283
      <br>
    </footer>

    <!-- Link to the JavaScript file -->
    <script src="Index.js"></script>
  </body>
</html>
