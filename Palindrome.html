    <!-- Main box -->
    <div class="container">

            <!-- Grish checking his ledger -->
    <img src="grish-ledger.png" alt="Grish checking his ledger" class="grish-img">
    
        <!-- Title -->
        <h1>Palindrome Checker</h1>

        <!-- Instructions -->
        <p>Ignore spaces and check if your text reads the same forwards and backwards.</p>

        <!-- Form -->
        <form id="palForm" method="post">
            <!-- Label for user text -->
            <label for="userText">Text to check:</label>
            <!-- Text input the user types in -->
            <input type="text" id="userText" name="userText">

            <!-- Label for last value -->
            <label for="textInput">Last checked value:</label>
            <!-- Read-only text input -->
            <input type="text" id="textInput" name="textInput" readonly>

            <!-- Start button -->
            <input type="submit" value="Start Checking">
        </form>

        <!-- Message area -->
        <div id="msg">Click "Start Checking" to begin.</div>
    </div>

    <!-- Link to external JavaScript -->
    <script src="Palindrome.js"></script>
</body>
